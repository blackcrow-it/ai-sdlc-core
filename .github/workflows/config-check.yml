name: AI SDLC Core Validation
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python skills/ai-sdlc-core/scripts/sdlc.py validate --bundled --task examples/task-auth.json
      - run: python -m unittest discover -s tests -v
      - run: python skills/ai-sdlc-core/scripts/sdlc.py doctor --offline
